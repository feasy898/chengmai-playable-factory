<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qacore fixture mini-exit</title>
<style>
  html, body { margin: 0; height: 100%; background: #10203a; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: #fff; font-family: sans-serif;
  }
  canvas { background: #24405f; border-radius: 8px; }
</style>
</head>
<body>
  <canvas id="stage" width="320" height="240"></canvas>
  <p id="label">qacore fixture：一块画布与一句文字</p>
  <script>
    const ctx = document.getElementById("stage").getContext("2d");
    ctx.fillStyle = "#ff8a3d";
    ctx.fillRect(24, 24, 120, 80);
    ctx.beginPath();
    ctx.arc(232, 128, 44, 0, Math.PI * 2);
    ctx.fillStyle = "#39a7ff";
    ctx.fill();
    ctx.fillStyle = "#ffd54d";
    ctx.font = "bold 22px sans-serif";
    ctx.fillText("MINI-EXIT", 100, 210);
  </script>
  <script>
    // QC 桥接桩（仅夹具用）：mini.html（oracle 字节复用件，只读）的仓自有扩展版——
    // 在其契约上追加 CHK06 取证面：__PF_QC__.cta()（结束页 CTA 热区中心）与
    // 结束页 CTA 点击后的渠道退出外呼（routeExit 单次锁与 engine-bridge 同语义）。
    // mini.html 本体受 REUSED-ASSETS.md 字节登记约束不可改，CHK02/CHK06 的金标层
    // 与 MUT-05（退出接口缺失）变异基座改用本夹具。
    (function () {
      let muted = true;                      // 首交互前必须静音
      window.PF = {
        isMuted: function () { return muted; },
        setMuted: function (v) { muted = !!v; },
      };
      let hints = 0;
      window.__PF_QC__ = {
        hint: function () {
          if (hints === 0) {                 // 第一次 hint 即首交互：解除静音
            document.dispatchEvent(new Event("pf:first-interaction"));
            muted = false;
          }
          hints += 1;
          if (hints >= 3) {                  // 3 次交互后到达结束页
            document.dispatchEvent(new CustomEvent("pf:end", { detail: { win: true } }));
          }
          return { x: 160, y: 120, type: "tap" };
        },
        state: function () { return hints >= 3 ? "end" : "playing"; },
        endScreenVisible: function () { return hints >= 3; },
        cta: function () { return hints >= 3 ? { x: 160, y: 120, type: "tap" } : null; },
      };
      // 退出路由（engine-bridge routeExit 同形：探测渠道全局，缺失回退 window.open）；
      // exitCalled 单次锁同桥语义（退出外呼仅第一次）。qacore 的退出桩接管对应
      // 全局并记账。MUT-05 退出接口缺失即变异下面的外呼行。
      let exitCalled = false;
      window.__pfRouteExit = function (url) {
        if (exitCalled) return;
        exitCalled = true;
        if (window.mraid && typeof window.mraid.open === "function") { window.mraid.open(url); return; }
        if (window.FbPlayableAd && typeof window.FbPlayableAd.onComplete === "function") {
          window.FbPlayableAd.onComplete(); return;
        }
        if (window.ExitApi && typeof window.ExitApi.exit === "function") { window.ExitApi.exit(); return; }
        if (typeof window.openAppStore === "function") { window.openAppStore(); return; }
        window.open(url);
      };
      document.addEventListener("pointerdown", function () {
        if (hints >= 3) {
          window.__pfRouteExit("https://example.com/mini-exit-landing");
        }
      });
      document.dispatchEvent(new Event("pf:ready"));
    })();
  </script>
</body>
</html>
